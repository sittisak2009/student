<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบสารสนเทศนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #a8ede0 0%, #fed6e3 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); }
        .btn-custom { background: linear-gradient(45deg, #ff758c, #ff7eb3); border: none; color: white; border-radius: 50px; font-weight: 500; }
        .btn-custom:hover { opacity: 0.9; color: white; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 420px;">
        <div class="card p-4 p-md-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark">🌸 ระบบโรงเรียน</h3>
                <p class="text-muted small">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2 small rounded-3">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="ระบุ Username" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">รหัสผ่าน (Password)</label>
                    <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="ระบุรหัสผ่าน" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 mb-3 shadow-sm">เข้าสู่ระบบ</button>
                <div class="text-center">
                    <span class="small text-muted">ยังไม่มีบัญชีนักเรียน?</span> 
                    <a href="/register" class="text-decoration-none small fw-bold text-danger">ลงทะเบียนที่นี่</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
