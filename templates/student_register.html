<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background: #f8f9fa; }</style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 450px;">
        <div class="card shadow-sm p-4 border-0 rounded-4 bg-white">
            <h3 class="fw-bold mb-1 text-center text-primary">📝 ลงทะเบียนนักเรียน</h3>
            <p class="text-center text-muted small mb-4">กรอกรหัสและชื่อเพื่อสร้างบัญชี</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-3 small">{{ message }}</div>
                {% endfor %}{% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">รหัสประจำตัวนักเรียน</label>
                    <input type="text" name="student_id" class="form-control form-control-lg rounded-pill px-3 fs-6" placeholder="เช่น 68001" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">ชื่อ - นามสกุล</label>
                    <input type="text" name="fullname" class="form-control form-control-lg rounded-pill px-3 fs-6" placeholder="เด็กชายสมชาย ใจดี" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">ตั้งรหัสผ่าน</label>
                    <input type="password" name="password" class="form-control form-control-lg rounded-pill px-3 fs-6" placeholder="รหัสผ่านสำหรับเข้าเว็บ" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm mb-3">ยืนยันลงทะเบียน</button>
                <div class="text-center">
                    <a href="/student/login" class="text-decoration-none small">มีบัญชีแล้ว? เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
