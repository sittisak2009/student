<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: #f4f7fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .form-card { border: none; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: #ffffff; width: 100%; max-width: 420px; }
        .btn-long { border-radius: 50rem; padding: 12px; font-weight: 600; }
        .form-control { border-radius: 50rem; padding: 12px 20px; background-color: #f8f9fa; border: 1px solid #e2e8f0; }
        .form-control:focus { background-color: #fff; box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15); }
    </style>
</head>
<body>
    <div class="form-card p-4 p-md-4">
        <h4 class="fw-bold text-center text-primary mb-1">📝 ลงทะเบียนสมาชิกใหม่</h4>
        <p class="text-center text-muted small mb-4">กรอกข้อมูลพื้นฐานเพื่อใช้งานระบบ</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="alert alert-{{ category }} rounded-4 small py-2">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary ms-2">รหัสประจำตัวนักเรียน</label>
                <input type="text" name="student_id" class="form-control" placeholder="เช่น 68001" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary ms-2">ชื่อ - นามสกุล</label>
                <input type="text" name="fullname" class="form-control" placeholder="เด็กชายสมชาย ใจดี" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary ms-2">ตั้งรหัสผ่าน</label>
                <input type="password" name="password" class="form-control" placeholder="รหัสผ่านสำหรับเข้าเว็บ" required>
            </div>
            <button type="submit" class="btn btn-primary btn-long w-100 shadow-sm mb-3">ยืนยันลงทะเบียน</button>
            <div class="text-center">
                <a href="/student/login" class="text-decoration-none small text-primary fw-medium">มีบัญชีแล้ว? เข้าสู่ระบบที่นี่</a>
            </div>
        </form>
    </div>
</body>
</html>
