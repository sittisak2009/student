<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัตรนักเรียนดิจิทัล</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: #f4f7fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card-box { width: 100%; max-width: 380px; }
        .id-card { width: 100%; height: 220px; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); border-radius: 20px; color: white; position: relative; overflow: hidden; box-shadow: 0 15px 30px rgba(79, 70, 229, 0.3); }
        .avatar-card { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid white; }
        .btn-long { border-radius: 50rem; padding: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card-box text-center">
        <h5 class="fw-bold mb-3 text-dark">🪪 บัตรประจำตัวนักเรียน</h5>
        
        <div class="id-card p-3 text-start mb-4">
            <div class="d-flex justify-content-between align-items-center border-bottom border-light border-opacity-25 pb-2 mb-2">
                <span class="small fw-semibold">🏫 SCHOOL CARD</span>
                <span class="badge bg-white text-primary rounded-pill" style="font-size: 10px;">VERIFIED</span>
            </div>
            <div class="row align-items-center mt-3">
                <div class="col-4 text-center">
                    <img src="{{ url_for('static', filename='uploads/' + user['profile_image']) }}" class="avatar-card shadow-sm">
                </div>
                <div class="col-8">
                    <h6 class="fw-bold mb-1 text-truncate">{{ user['fullname'] }}</h6>
                    <p class="small mb-1 text-white-50">รหัส: {{ user['student_id'] }}</p>
                    <p class="small mb-0 text-white-50">สถานะ: {{ user['status'] }}</p>
                </div>
            </div>
            <div class="position-absolute bottom-0 end-0 p-2 bg-white rounded-start-4" id="qrcode" style="width: 55px; height: 55px; display: flex; align-items: center; justify-content: center;"></div>
        </div>

        <a href="/student/dashboard" class="btn btn-secondary btn-long w-100 shadow-sm">← กลับหน้าหลัก</a>
    </div>

    <script>
        const verifyUrl = window.location.origin + "/verify/" + "{{ user['student_id'] }}";
        new QRCode(document.getElementById("qrcode"), {
            text: verifyUrl,
            width: 42,
            height: 42
        });
    </script>
</body>
</html>
