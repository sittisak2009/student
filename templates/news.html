<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ประกาศข่าวสารโรงเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; background: #f8f9fa; }</style>
</head>
<body class="py-4">
    <div class="container" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">📢 ประกาศข่าวสารจากโรงเรียน</h4>
            <a href="/profile" class="btn btn-outline-secondary btn-sm rounded-pill">กลับหน้าโปรไฟล์</a>
        </div>

        {% for n in announcements %}
        <div class="card border-0 shadow-sm p-4 mb-3 rounded-4 bg-white">
            <h5 class="fw-bold text-primary mb-1">{{ n[1] }}</h5>
            <p class="text-muted small mb-2">เผยแพร่เมื่อ: {{ n[3] }}</p>
            <p class="mb-0">{{ n[2] }}</p>
        </div>
        {% else %}
        <div class="text-center py-5 text-muted">ยังไม่มีประกาศข่าวสารในขณะนี้</div>
        {% endfor %}
    </div>
</body>
</html>
