<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนนักเรียน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: rgba(255, 255, 255, 0.95); }
        .btn-custom { background: linear-gradient(45deg, #4facfe, #00f2fe); border: none; color: white; border-radius: 50px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <div class="card p-4 p-md-5">
            <h3 class="text-center fw-bold text-dark mb-1">📝 ลงทะเบียนนักเรียน</h3>
            <p class="text-center text-muted small mb-4">ต้องใช้รหัสและชื่อ-นามสกุลที่คุณครูกำหนดไว้ล่วงหน้าเท่านั้น</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} py-2 small rounded-3">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">รหัสนักเรียน (ที่โรงเรียนกำหนด)</label>
                    <input type="text" name="student_id" class="form-control rounded-pill px-3" placeholder="เช่น 68001" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">ชื่อ - นามสกุลจริง (ให้ตรงกับฐานข้อมูลครู)</label>
                    <input type="text" name="fullname" class="form-control rounded-pill px-3" placeholder="นาย..." required>
                </div>
                <hr class="text-muted my-3">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">ตั้งชื่อผู้ใช้ (Username)</label>
                    <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="Username สำหรับเข้าเว็บ" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">ตั้งรหัสผ่าน (Password)</label>
                    <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="รหัสผ่านปลอดภัย" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label small fw-semibold">ส่วนสูง (ซม.)</label>
                        <input type="number" step="0.1" name="height" class="form-control rounded-pill px-3" placeholder="170" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label small fw-semibold">น้ำหนัก (กก.)</label>
                        <input type="number" step="0.1" name="weight" class="form-control rounded-pill px-3" placeholder="60" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">รูปถ่ายหน้าตรง</label>
                    <input type="file" name="profile_image" class="form-control rounded-pill px-3" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 mb-3 shadow-sm">ยืนยันลงทะเบียน</button>
                <div class="text-center">
                    <a href="/login" class="text-decoration-none small text-muted">มีบัญชีแล้ว? เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
