<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบโรงเรียนของเรา</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .welcome-card { border: none; border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); width: 100%; max-width: 420px; }
        .btn-custom { border-radius: 50rem; padding: 14px 24px; font-weight: 600; font-size: 1.05rem; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .btn-custom:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="welcome-card p-4 p-md-5 text-center">
        <div class="mb-4">
            <span class="display-4">🏫</span>
            <h2 class="fw-bold mt-2 text-dark">School Portal</h2>
            <p class="text-muted small">ระบบสารสนเทศและเช็คข้อมูลนักเรียน</p>
        </div>
        <div class="d-grid gap-3">
            <a href="/student/login" class="btn btn-primary btn-custom bg-gradient border-0">🎓 เข้าสู่ระบบนักเรียน</a>
            <a href="/teacher/login" class="btn btn-success btn-custom bg-gradient border-0">👨‍🏫 เข้าสู่ระบบคุณครู</a>
        </div>
    </div>
</body>
</html>
